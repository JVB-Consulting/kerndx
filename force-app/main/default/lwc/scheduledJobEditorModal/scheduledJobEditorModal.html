<template>
	<lightning-modal-header label={formTitle}></lightning-modal-header>
	<lightning-modal-body>
		<div class="slds-var-p-around_medium" data-testid="scheduled-job-editor-root">
			<template lwc:if={hasErrorMessage}>
				<div class="slds-scoped-notification slds-media slds-media_center slds-theme_error slds-var-m-bottom_small" data-testid="inline-error" role="alert">
					<div class="slds-media__figure">
						<lightning-icon icon-name="utility:error" size="small" variant="inverse"></lightning-icon>
					</div>
					<div class="slds-media__body">
						<p data-testid="inline-error-message">{errorMessage}</p>
					</div>
				</div>
			</template>
			<div class="slds-grid slds-wrap">
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-horizontal_x-small">
					<lightning-input data-testid="scheduler-name" label={labels.schedulerName} onchange={handleSchedulerNameChange} required
									 value={schedulerName}></lightning-input>
				</div>
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-horizontal_x-small">
					<template lwc:if={isClassNameLocked}>
						<lightning-input data-testid="class-name" label={labels.className} read-only required value={className}></lightning-input>
					</template>
					<template lwc:else>
						<c-scheduled-job-class-picker data-testid="class-name" error-message={classNameError} label={labels.className} onclasschange={handleClassNameChange}
													  options={classOptions} placeholder={labels.classPlaceholder} required value={className}></c-scheduled-job-class-picker>
					</template>
				</div>
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-horizontal_x-small">
					<lightning-input checked={isActive} label={labels.active} message-toggle-active={labels.active} message-toggle-inactive={labels.inactive}
									 onchange={handleIsActiveChange} type="toggle"></lightning-input>
				</div>
			</div>

			<div class="slds-var-m-top_medium">
				<h3 class="slds-text-heading_small slds-var-m-bottom_small">{scheduleHeading}</h3>
				<c-cron-expression-editor job-runner-mode={isJobRunnerMode} oncronchange={handleCronChange} value={cronExpression}></c-cron-expression-editor>
			</div>

			<template lwc:if={hasParameterDefinitions}>
				<div class="slds-var-m-top_medium">
					<h3 class="slds-text-heading_small slds-var-m-bottom_small">{labels.parameters}</h3>
					<div class="slds-grid slds-wrap">
						<template for:each={editParameterFields} for:item="parameter">
							<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-horizontal_x-small" key={parameter.name}>
								<template lwc:if={parameter.isText}>
									<lightning-input data-parameter-name={parameter.name} data-testid={parameter.testId} field-level-help={parameter.description}
													 label={parameter.label} onchange={handleParameterChange} read-only={parameter.isLocked} required={parameter.isRequired}
													 value={parameter.value}></lightning-input>
								</template>
								<template lwc:elseif={parameter.isNumeric}>
									<lightning-input data-parameter-name={parameter.name} data-testid={parameter.testId} field-level-help={parameter.description}
													 label={parameter.label} onchange={handleParameterChange} read-only={parameter.isLocked} required={parameter.isRequired}
													 step="1" type="number" value={parameter.value}></lightning-input>
								</template>
								<template lwc:elseif={parameter.isToggle}>
									<lightning-input checked={parameter.toggleChecked} data-parameter-name={parameter.name} data-testid={parameter.testId}
													 disabled={parameter.isLocked} field-level-help={parameter.description} label={parameter.label}
													 message-toggle-active={labels.yes} message-toggle-inactive={labels.no} onchange={handleParameterChange}
													 type="toggle"></lightning-input>
								</template>
							</div>
						</template>
					</div>
				</div>
			</template>

			<div class="slds-var-m-top_medium">
				<lightning-textarea label={labels.description} onchange={handleDescriptionChange} value={description}></lightning-textarea>
			</div>
		</div>
	</lightning-modal-body>
	<lightning-modal-footer>
		<lightning-button class="slds-var-m-right_x-small" data-testid="cancel-button" disabled={isSaving} label={labels.cancel} onclick={handleCancel}></lightning-button>
		<lightning-button data-testid="save-button" disabled={isSaveDisabled} label={labels.save} onclick={handleSave} variant="brand"></lightning-button>
	</lightning-modal-footer>
</template>
