<template>
	<lightning-card data-testid="scheduled-job-editor-root" title={formTitle}>
		<div class="slds-var-p-around_medium">
			<div class="slds-grid slds-wrap slds-gutters_small">
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-m-bottom_small">
					<lightning-input data-testid="scheduler-name" label={label.schedulerName} onchange={handleSchedulerNameChange} required value={schedulerName}></lightning-input>
				</div>
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-m-bottom_small">
					<c-scheduled-job-class-picker data-testid="class-name" error-message={classNameError} label={label.className} onclasschange={handleClassNameChange}
												  options={classOptions} placeholder={label.classPlaceholder} required value={className}></c-scheduled-job-class-picker>
				</div>
				<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-m-bottom_small">
					<lightning-input checked={isActive} data-testid="is-active" label={label.active} message-toggle-active={label.active} message-toggle-inactive={label.inactive}
									 onchange={handleIsActiveChange} type="toggle"></lightning-input>
				</div>
			</div>

			<div class="slds-var-m-top_medium">
				<lightning-radio-group data-testid="execution-mode" disabled={isExecutionModeDisabled} label={label.executionMode} name="executionMode"
									   onchange={handleExecutionModeChange} options={executionModeOptions} type="radio" value={executionMode}></lightning-radio-group>
				<template lwc:if={showPermissionNote}>
					<p class="slds-text-body_small slds-text-color_weak" data-testid="job-runner-permission-note">{label.jobRunnerPermissionNote}</p>
				</template>
				<template lwc:if={isJobRunnerMode}>
					<p class="slds-text-body_small slds-text-color_weak slds-var-m-top_xx-small" data-testid="job-runner-note">{jobRunnerNote}</p>
					<div class="slds-grid slds-wrap slds-gutters_small slds-var-m-top_small">
						<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
							<lightning-input data-testid="run-priority" field-level-help={label.runPriorityHelp} label={label.runPriority} min="0"
											 onchange={handleRunPriorityChange} step="1" type="number" value={runPriority}></lightning-input>
						</div>
						<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
							<lightning-radio-group data-testid="overlap-policy" label={label.overlapPolicy} name="overlapPolicy" onchange={handleOverlapPolicyChange}
												   options={overlapPolicyOptions} type="radio" value={overlapPolicy}></lightning-radio-group>
						</div>
					</div>
				</template>
			</div>

			<div class="slds-var-m-top_medium">
				<h3 class="slds-text-heading_small slds-var-m-bottom_small">{scheduleHeading}</h3>
				<c-cron-expression-editor active-check-interval-minutes={activeCheckIntervalMinutes} job-runner-mode={isJobRunnerMode} oncronchange={handleCronChange}
										  value={cronExpression}></c-cron-expression-editor>
				<template lwc:if={isJobRunnerMode}>
					<p class="slds-text-body_small slds-var-m-top_x-small" data-testid="next-run-preview">{nextRunPreviewLabel}</p>
				</template>
			</div>

			<template lwc:if={hasParameterDefinitions}>
				<div class="slds-var-m-top_medium">
					<h3 class="slds-text-heading_small slds-var-m-bottom_small">{label.parameters}</h3>
					<div class="slds-grid slds-wrap slds-gutters_small">
						<template for:each={editParameterFields} for:item="parameter">
							<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-m-bottom_small" key={parameter.name}>
								<template lwc:if={parameter.isText}>
									<lightning-input data-parameter-name={parameter.name} data-testid={parameter.testId} field-level-help={parameter.description}
													 label={parameter.label} onchange={handleParameterChange} read-only={parameter.isLocked} required={parameter.isRequired}
													 value={parameter.value}></lightning-input>
								</template>
								<template lwc:elseif={parameter.isNumeric}>
									<lightning-input data-parameter-name={parameter.name} data-testid={parameter.testId} field-level-help={parameter.description}
													 label={parameter.label} onchange={handleParameterChange} read-only={parameter.isLocked} required={parameter.isRequired}
													 step="1" type="number" value={parameter.value}></lightning-input>
								</template>
								<template lwc:elseif={parameter.isToggle}>
									<lightning-input checked={parameter.toggleChecked} data-parameter-name={parameter.name} data-testid={parameter.testId}
													 disabled={parameter.isLocked} field-level-help={parameter.description} label={parameter.label}
													 message-toggle-active={label.yes} message-toggle-inactive={label.no} onchange={handleParameterChange}
													 type="toggle"></lightning-input>
								</template>
							</div>
						</template>
					</div>
				</div>
			</template>

			<div class="slds-var-m-top_medium">
				<lightning-textarea label={label.description} onchange={handleDescriptionChange} value={description}></lightning-textarea>
			</div>
		</div>

		<div slot="footer">
			<lightning-button class="slds-var-m-right_x-small" data-testid="cancel-button" disabled={isSaving} label={label.cancel} onclick={handleCancel}></lightning-button>
			<lightning-button data-testid="save-button" disabled={isSaveDisabled} label={label.save} onclick={handleSave} variant="brand"></lightning-button>
		</div>
	</lightning-card>
</template>
